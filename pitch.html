<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>let's get pitchy</title>
  <link rel="shortcut icon" href="./assets/images/logo.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/pitch.css">
</head>
<body>

<header>
  <a class="back" href="./"><- twosodium</a>
  <h1>Let's get pitchy</h1>
</header>

<nav class="page-nav">
  <a href="#game-boundary">01</a>
  <a href="#game-chord">02</a>
  <a href="#game-melody">03</a>
  <a href="#game-tune">04</a>
</nav>


<section class="game-section" id="game-boundary">
  <h2>Is my pitch your pitch?</h2>
  <p class="desc">Inspired by <a href="https://ismy.blue">[Is my blue your blue?]</a>
  </p>

  <div class="row">
    <label>note pair</label>
    <select id="bnd-a"></select>
    <select id="bnd-b" style="display:none"></select>
    <button class="btn accent" id="bnd-start">start</button>
  </div>

  <div id="bnd-game" style="display:none">
    <p class="trial-line" id="bnd-trial" style="margin-bottom:14px"></p>

    <div class="b-meter-wrap" id="bnd-meter-wrap" style="display:none">
      <div class="b-labels">
        <span id="bnd-lbl-a">A</span>
        <span id="bnd-lbl-b">B</span>
      </div>
      <div class="b-meter">
        <div class="b-center" id="bnd-center"></div>
        <div class="b-marker" id="bnd-marker"></div>
      </div>
    </div>

    <div class="row">
      <button class="btn accent" id="bnd-play">play</button>
      <button class="btn" id="bnd-replay" disabled>replay</button>
      <button class="btn" id="bnd-dl" disabled>↓ wav</button>
      <button class="btn" id="bnd-btn-a" disabled>← closer to <span id="bnd-na">A</span></button>
      <button class="btn" id="bnd-btn-b" disabled>closer to <span id="bnd-nb">B</span> →</button>
    </div>
  </div>

  <div class="result" id="bnd-result"></div>
</section>

<section class="game-section" id="game-chord">
  <h2>Chord ID</h2>
  <p class="desc">
  </p>

  <div class="row">
    <label>n notes</label>
    <select id="chord-n">
      <option value="2">2</option>
      <option value="3" selected>3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
    </select>
    <label>soundfont</label>
    <select id="chord-sf">
      <option value="acoustic_grand_piano">piano</option>
      <option value="string_ensemble_1">strings</option>
      <option value="lead_2_sawtooth">synth</option>
      <option value="brass_section">brass</option>
    </select>
    <button class="btn accent" id="chord-play-btn">play chord</button>
  </div>

  <p class="sublabel"></p>
  <div class="note-grid" id="chord-grid"></div>

  <div class="row">
    <button class="btn" id="chord-replay" disabled>replay</button>
    <button class="btn accent" id="chord-submit" disabled>submit</button>
    <button class="btn" id="chord-new" style="display:none">new chord</button>
    <button class="btn" id="chord-dl" disabled>↓ wav</button>
  </div>

  <div class="result" id="chord-result"></div>
</section>

<section class="game-section" id="game-melody">
  <h2>Memory test</h2>
  <p class="desc">
    Reproduce the melody on the keyboard
  </p>

  <div class="row">
    <label>start</label>
    <select id="mel-len">
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5" selected>5</option>
      <option value="6">6</option>
      <option value="8">8</option>
    </select>
    <label>add per round</label>
    <select id="mel-add">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3" selected>3</option>
      <option value="5">5</option>
    </select>
    <button class="btn accent" id="mel-play">start</button>
    <button class="btn" id="mel-replay" disabled>replay</button>
  </div>

  <p class="sublabel" id="mel-round-info" style="display:none; color:#555; margin-bottom:12px"></p>

  <div class="piano-scroll">
    <div class="piano" id="mel-piano"></div>
  </div>

  <p class="sublabel">
    You selected:&nbsp;<span id="mel-input" style="color:#c7c7c7; letter-spacing:1px"></span>
  </p>

  <div class="row" style="margin-top:10px">
    <button class="btn" id="mel-clear">clear</button>
    <button class="btn accent" id="mel-submit" disabled>submit</button>
    <button class="btn" id="mel-restart" style="display:none">restart</button>
    <button class="btn" id="mel-dl" disabled>↓ wav</button>
  </div>

  <div class="result" id="mel-result"></div>
</section>

<section class="game-section" id="game-tune">
  <h2>Out of tune</h2>
  <p class="desc">
    This piano is a little broken. Which note is the played note closest to?
  </p>

  <div class="row">
    <button class="btn accent" id="tune-play">play note</button>
    <button class="btn" id="tune-replay" disabled>replay</button>
  </div>

  <p class="sublabel"></p>
  <div class="note-grid" id="tune-grid"></div>

  <div class="row" style="margin-bottom:14px">
    <button class="btn" id="tune-sharp" disabled>It's sharp ♯</button>
    <button class="btn" id="tune-flat" disabled>It's flat ♭</button>
  </div>

  <div class="row">
    <label>Exact frequency guess:</label>
    <input type="number" id="tune-hz" placeholder="e.g. 442.1" step="0.1" disabled>
    <span style="font-size:11px; color:#333"></span>
  </div>

  <div class="row" style="margin-top:6px">
    <button class="btn accent" id="tune-submit" disabled>submit</button>
    <button class="btn" id="tune-new" style="display:none">new note</button>
    <button class="btn" id="tune-dl" disabled>↓ wav</button>
  </div>

  <div class="result" id="tune-result"></div>
</section>


<script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
<script src="./assets/js/pitch.js"></script>
</body>
</html>
